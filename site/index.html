<title>Prop Finder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: one narrow column built for a phone. Sticky bar (title + two tabs), filters, then ranked prop cards. */
:root{
  --bg:#f5f6f9; --surface:#ffffff; --ink:#151821; --muted:#5a6376; --line:#dde1ea;
  --accent:#3846c4; --accent-soft:#e8eafa; --on-accent:#ffffff;
  --good:#17803d; --good-soft:#e2f4e8; --warn:#9a5a00; --warn-soft:#fdf0d6; --bad:#b32424; --bad-soft:#fbe3e3;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'Space Grotesk','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f121a; --surface:#171b27; --ink:#e8ebf3; --muted:#98a2b6; --line:#2a3042;
  --accent:#95a1ff; --accent-soft:#232a4d; --on-accent:#0f121a;
  --good:#4cc47c; --good-soft:#16301f; --warn:#e9b24c; --warn-soft:#352a10; --bad:#f27d7d; --bad-soft:#3b1c1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f121a; --surface:#171b27; --ink:#e8ebf3; --muted:#98a2b6; --line:#2a3042;
  --accent:#95a1ff; --accent-soft:#232a4d; --on-accent:#0f121a;
  --good:#4cc47c; --good-soft:#16301f; --warn:#e9b24c; --warn-soft:#352a10; --bad:#f27d7d; --bad-soft:#3b1c1c; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{--chrome:0px}
@media (max-width:640px){:root{--chrome:44px}}   /* phones: leave room for the Claude app's floating close / menu buttons */
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;padding:0 0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:calc(env(safe-area-inset-top,0px) + var(--chrome));z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-top:var(--chrome);overflow-x:clip;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--chrome));z-index:5;background:var(--bg);padding-top:14px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.statusrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 12px}
h1{font-family:var(--font-head);font-size:22px;letter-spacing:-.01em;margin:0}
#asof{color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:2px;margin-top:6px;overflow-x:auto}
.rbtn{padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-weight:600;font-size:13px;cursor:pointer}
.rbtn[disabled]{opacity:.6;cursor:default}
.rbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.trk{padding:2px 10px;border:1px solid var(--accent);border-radius:99px;background:none;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer}
.trk[disabled]{border-color:var(--line);color:var(--muted);cursor:default}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:grid;gap:2px;min-width:0}
.tile b{font-family:var(--font-head);font-size:20px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.tile.good b{color:var(--good)} .tile.bad b{color:var(--bad)}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.brow:first-of-type{border-top:0}
.brow .bres{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.brow .bres.good{color:var(--good)} .brow .bres.bad{color:var(--bad)} .brow .bres.neutral{color:var(--muted)}
.brow .del{grid-column:1/-1;justify-self:start;border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:0}
.ctab{display:grid;grid-template-columns:1.3fr .5fr .7fr .7fr;gap:4px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.ctab .h{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.rpanel{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:13.5px;display:grid;gap:8px}
.rpanel.good{background:var(--good-soft);color:var(--good)}
.rpanel.bad{background:var(--bad-soft);color:var(--bad)}
.rrow{display:flex;gap:8px;flex-wrap:wrap}
.rrow button{padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.rrow button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sports{display:flex;gap:6px}
.sport{padding:5px 14px;border:1px solid var(--line);border-radius:99px;background:var(--surface);cursor:pointer;font-weight:600;font-size:13.5px}
.sport[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab{flex:1;white-space:nowrap;font-size:13px;padding:10px 5px;border:0;background:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{display:inline-block;min-width:20px;margin-left:4px;padding:0 6px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:12px}
.notice{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.controls{display:grid;gap:10px;margin:14px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);cursor:pointer;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;padding:9px 6px;border:0;background:none;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.hint{color:var(--muted);font-size:13px;margin:0}
#list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.card.dim{opacity:.62}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.who{min-width:0}
.name{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:12.5px}
.pct{font-family:var(--font-head);font-weight:700;font-size:28px;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.pct small{display:block;font-family:var(--font-body);font-weight:400;font-size:11px;color:var(--muted);margin-top:4px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.inputs{display:grid;grid-template-columns:auto 1fr 1fr;gap:10px;align-items:end}
.side{font-weight:600;padding-bottom:9px}
.res{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.pill{padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums}
.pill.good{background:var(--good-soft);color:var(--good);font-weight:600}
.pill.bad{background:var(--bad-soft);color:var(--bad);font-weight:600}
.l5{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.l5 b{font-weight:600;min-width:26px;text-align:center;padding:2px 0;border-radius:6px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.l5 b.hit{background:var(--good-soft);color:var(--good)}
.l5 b.miss{background:var(--bad-soft);color:var(--bad)}
.srows{display:grid;gap:12px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 72px 72px;gap:8px 10px;align-items:end;padding-top:12px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0;padding-top:0}
.spred{display:grid;gap:1px;min-width:0}
.spred .slabel{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.spred b{font-family:var(--font-head);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.spred .range{font-size:12px;color:var(--muted)}
.sres{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.srl5{grid-column:1/-1;flex-wrap:wrap}
.srow .field input{padding:7px 8px}
.gh{color:var(--ink);font-family:var(--font-head);font-size:15px;text-transform:none;letter-spacing:0;margin:14px 0 0}
.mk{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.mk:first-of-type{border-top:0;padding-top:0}
.mk-head{display:flex;align-items:end;justify-content:space-between;gap:10px}
.mk-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-bottom:9px}
.mk-head .field{width:96px}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(92px,1fr))}
.opts.o3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{display:grid;gap:4px;min-width:0;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.olab{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.opct{font-family:var(--font-head);font-weight:700;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.opt input{width:100%;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.oedge{font-size:12px;min-height:18px}
.oedge .pill{padding:1px 7px}
.orow{display:grid;grid-template-columns:minmax(0,1fr) auto 84px;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.orow:first-of-type{border-top:0}
.orow .oname{font-weight:600;overflow-wrap:anywhere}
.orow .osub{font-size:12px;color:var(--muted)}
.orow .opct{font-size:20px;text-align:right}
.orow .oedge{grid-column:1/-1}
.obar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.crest{flex:none;border-radius:50%;background:#fff;border:1px solid var(--line);padding:3px;object-fit:contain;box-sizing:border-box}
.crest.ph{display:inline-grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;padding:0}
.mrow{display:grid;gap:8px;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.mmeta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12.5px}
.mline{display:flex;align-items:center;gap:10px}
.mname{flex:1;min-width:0;font-weight:600;font-size:16px;overflow-wrap:anywhere}
.mpct{font-family:var(--font-head);font-size:20px;font-variant-numeric:tabular-nums}
.mfoot{display:flex;gap:4px 12px;flex-wrap:wrap;justify-content:space-between;color:var(--muted);font-size:12.5px}
.dhead{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;text-align:center}
.dteam{display:grid;justify-items:center;gap:6px;font-weight:600;overflow-wrap:anywhere}
.dvs{color:var(--muted);font-size:13px}
.dmeta{text-align:center}
.tg{display:flex;align-items:center;gap:8px}
.oteam{display:flex;align-items:center;gap:10px;min-width:0}
details summary{cursor:pointer;color:var(--muted);font-size:12.5px}
details p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.more{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:500}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);margin-bottom:4px;font-size:16px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 0}
.about{margin-top:26px;padding-top:14px;border-top:1px solid var(--line)}
.about summary{font-weight:600;color:var(--ink);font-size:14px}
.about ul{padding-left:18px;color:var(--muted);font-size:13.5px}
.about li{margin:6px 0}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="bar"><h1>Prop Finder</h1><div class="sports" id="sports" role="group" aria-label="Sport"></div></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  </header>
  <div class="statusrow"><span id="asof">Loading&#8230;</span><button class="rbtn" id="rbtn" type="button" hidden>Refresh now</button><button class="rbtn" id="recbtn" type="button" aria-pressed="false">Record</button></div>

  <div class="notice" id="stale" hidden></div>
  <div class="rpanel" id="rpanel" role="status" hidden></div>

  <section class="controls" aria-label="Filters">
    <div class="chips" id="lg-chips" hidden></div>
    <div class="chips" id="stat-chips"></div>
    <div class="grid2" id="g-game">
      <label class="field" id="game-field"><span>Game</span><select id="game"></select></label>
      <label class="field"><span id="q-label">Player</span><input id="q" type="search" placeholder="Search name" autocomplete="off"></label>
    </div>
    <div class="grid2" id="g-min">
      <label class="field"><span>Minimum odds</span><input id="min" type="number" inputmode="decimal" step="0.01" min="1" placeholder="e.g. 1.50"></label>
      <label class="field"><span>Starting line</span>
        <select id="target"><option value="0.7">70% chance</option><option value="0.8">80% chance</option><option value="0.9">90% chance</option></select></label>
    </div>
    <div class="seg" id="g-side" role="group" aria-label="Over or under">
      <button id="side-over" data-side="over" aria-pressed="true">Over</button>
      <button id="side-under" data-side="under" aria-pressed="false">Under</button>
    </div>
    <p class="hint" id="hint"></p>
  </section>

  <main id="list" aria-live="polite"><div class="empty">Loading predictions&#8230;</div></main>

  <details class="about">
    <summary>How accurate is this?</summary>
    <ul id="about-list"></ul>
  </details>
</div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var LS='propfinder-v1', CAP=0.9, PAGE=40;
  var STATS_NBA=['pts','reb','ast','fg3'];
  var SPORTS={
    nba:{label:'NBA',file:'predictions.json',tabs:['matches','best','probable'],noun:'game',names:{matches:'Games'},about:[
      '<strong>The percentage</strong> is the model\'s chance that the player lands on your side of the line. Change the line to the one your bookmaker offers and it recalculates.',
      '<strong>Tested on past games</strong> the model had not seen: when it said 70\u201380% the prop hit about 73% of the time. Above 90% it hit between 86% and 94%, depending on the stat, so this page never shows more than 90%.',
      '<strong>Edge</strong> is the expected profit for every 100 you stake at the odds you typed. A positive number means the odds pay more than the model thinks the bet is worth. It is an estimate, not a promise.',
      '<strong>Games:</strong> the game model predicts each team\'s score from attack and defence ratings, home court and back-to-backs. Tested on about 1,000 unseen regular-season games it picked the winner 69% of the time and its chances matched what happened (totals run slightly high). Against DraftKings\' pre-game lines on the same games it did slightly worse (typical margin miss 14.9 points against the bookmaker\'s 14.0) and it added nothing the line did not already contain. Betting every disagreement with the line would have lost about 2% per bet. The model now also adjusts for players ruled out or doubtful; on past games that trimmed the typical margin miss only from 11.65 to 11.54 points (bookmaker 10.93). So treat a gap between this page and your bookmaker as more likely a weakness in this model, which cannot see late injury news or how good a replacement is, than as a bargain.',
      '<strong>Not covered:</strong> the effect of a teammate being out (flagged on the card, not priced in). Top scorers outscored the model by about 0.7 points in testing. Real bookmaker lines have not been back-tested. Only one and a half seasons of games are in the data.']},
    football:{label:'Football',file:'predictions_soccer.json',tabs:['matches','best','probable','outrights'],noun:'match',about:[
      '<strong>Matches:</strong> tested on 1,400 matches the model had not seen, its win/draw/loss probabilities scored clearly better than a guess based on league averages, and home-win and handicap chances matched what happened. <strong>Total goals is the weakest market</strong> (it said 53% for over 2.5 goals; 56% happened).',
      '<strong>Players:</strong> chances assume the player plays. Line-ups come out about an hour before kick-off, so check he starts. Shots and shots on target were well calibrated over 28,000 test player-games; goals and assists are rare events, so those are rougher, and goals or assists lines above 0.5 were not tested.',
      '<strong>Outrights</strong> come from simulating the rest of each league 20,000 times. For the Champions League only the league phase is simulated (top 8, playoff, out); trophy chances are held back until the knockout draw has been made. The model uses last season too, so it can rate a team above one with more points this season. Test runs on last season were reasonable but small, so treat big favourites as less certain than shown. Nothing is shown above 90%.',
      '<strong>Edge</strong> is the expected profit for every 100 you stake at the odds you typed. It is an estimate, not a promise. Only suggestions: this page places nothing. Check what is legal where you are, and only stake money you can afford to lose.']}
  };
  var TABNAME={matches:'Matches',best:'Best bets',probable:'Most probable',outrights:'Outrights'};
  var S={view:null,sport:'nba',tab:'probable',stat:'all',game:'all',q:'',min:'',target:0.8,side:'over',rows:{},ol:null,om:'title',match:null,mview:'props',mteam:'all',lg:'all'};
  try{var saved=JSON.parse(localStorage.getItem(LS)||'{}');for(var k in saved)S[k]=saved[k];}catch(e){}
  if(!SPORTS[S.sport])S.sport='nba';
  S.shown=PAGE;
  function save(){try{localStorage.setItem(LS,JSON.stringify({sport:S.sport,tab:S.tab,stat:S.stat,min:S.min,target:S.target,side:S.side,rows:S.rows,ol:S.ol,om:S.om}));}catch(e){}}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

  /* Negative-binomial distribution: the same shape the models were calibrated with. */
  var cache={};
  function dist(mu,alpha){
    var key=mu+'|'+alpha; if(cache[key])return cache[key];
    var n=1/alpha,p=n/(n+mu),pmf=[Math.pow(p,n)],cdf=[pmf[0]];
    for(var k=0;k<300&&cdf[k]<0.999999;k++){var nx=pmf[k]*(k+n)/(k+1)*(1-p);pmf.push(nx);cdf.push(cdf[k]+nx);}
    return cache[key]={pmf:pmf,cdf:cdf};
  }
  function CDF(d,k){return k<0?0:(k>=d.cdf.length?1:d.cdf[k])}
  function PMF(d,k){return (k<0||k>=d.pmf.length)?0:d.pmf[k]}
  function probs(d,line,side){
    var f=Math.floor(line),whole=(line===f);
    if(side==='over')return{win:1-CDF(d,f),push:whole?PMF(d,f):0};
    return{win:whole?CDF(d,f-1):CDF(d,f),push:whole?PMF(d,f):0};
  }
  function safeLine(d,side,t){
    var k=0;
    if(side==='over'){while(1-CDF(d,k+1)>=t)k++;}
    else{while(CDF(d,k)<t)k++;}
    return k+0.5;
  }
  /* With a minimum odds set: the line with the highest chance that still pays at least that
     (a bet pays at least `min` only if its chance is at most 1/min). */
  function minLine(d,side,cap){
    var k=0;
    if(side==='over'){while(1-CDF(d,k)>cap)k++;return{line:k+0.5,ok:true};}
    if(CDF(d,0)>cap)return{line:0.5,ok:false};
    while(CDF(d,k+1)<=cap)k++;
    return{line:k+0.5,ok:true};
  }
  function qtile(d,q){var k=0;while(CDF(d,k)<q)k++;return k}
  function typicalLine(mu){return Math.floor(mu)+0.5}

  /* ---------- data per sport ---------- */
  var C={};            // sport -> {d, ROWS, ROWMAP, GAMES, STATS}
  var cur=null;
  function stateKey(r){return r.base+'|'+S.side}
  function fmtOdds(x){return x==null?'\u2013':(x>99?'99+':x.toFixed(2))}
  function fmtLine(x){return Number.isInteger(x)?String(x):x.toFixed(1)}
  function fmtPct(e){return e.capped?'90%+':(e.win<0.005?'<1%':Math.round(e.win*100)+'%')}
  function when(g){try{return new Date(g.start).toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'})}catch(e){return g.date}}
  function gname(g){return g.league_name?g.home+' v '+g.away:g.away+' at '+g.home}
  function edgePill(ev,short){
    if(ev==null)return '';
    var pc=Math.round(ev*100);

  /* ---------- football matches ---------- */
  function gridProb(grid,kind,sel,line){
    var win=0,push=0;
    for(var i=0;i<grid.length;i++)for(var j=0;j<grid[i].length;j++){
      var p=grid[i][j];
      if(kind==='1x2'){if((sel==='home'&&i>j)||(sel==='draw'&&i===j)||(sel==='away'&&j>i))win+=p;}
      else if(kind==='hcp'){var d=(sel==='home'?i-j:j-i)+(sel==='home'?line:-line);if(d>0)win+=p;else if(d===0)push+=p;}
      else if(kind==='tot'){var t=i+j;if(sel==='over'){if(t>line)win+=p;else if(t===line)push+=p;}else{if(t<line)win+=p;else if(t===line)push+=p;}}
      else if(kind==='btts'){var both=i>0&&j>0;if((sel==='yes')===both)win+=p;}
    }
    return{win:win,push:push};
  }
  /* NBA: the model gives an expected margin and total with a spread; scores are whole numbers so lines get a half-point correction */
  function ncdf(z){var t=1/(1+0.2316419*Math.abs(z)),d=0.3989423*Math.exp(-z*z/2),p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}

  function nbaProb(m,kind,sel,line){
    var g=m.nba;

  /* ----- settling ----- */

    if(!g)return (Date.now()-b.t)/864e5>(RESULTS.days||21)-3?{s:'unknown',note:'too old to find a result'}:{s:'wait',note:'waiting for the result'};
    var out;
    if(b.ty==='prop'){
      var rec=g.players[b.pl]; if(!rec)return{s:'void',note:'did not play'};
      var v=rec[(b.sp==='football'?RESULTS.football_stats:RESULTS.nba_stats).indexOf(b.st)];
      out=b.sd==='over'?cmpOver(v,b.ln):cmpUnder(v,b.ln);

      var mg=g.home_pts-g.away_pts, tot=g.home_pts+g.away_pts;

      else if(b.kd==='spr')out=b.se==='home'?(mg+b.ln>0?'won':(mg+b.ln===0?'push':'lost')):(-mg-b.ln>0?'won':(-mg-b.ln===0?'push':'lost'));

    }

      var good=items.filter(function(x){return x.e.ev>0}).map(function(x){return{ev:x.e.ev,html:cardHTML(x.r,x.e,false)}});
      var bad=items.filter(function(x){return x.e.ev<=0}).map(function(x){return{ev:x.e.ev,html:cardHTML(x.r,x.e,true)}});
      if(S.game==='all'&&!S.q&&S.stat==='all')pricedExtras().forEach(function(x){(x.ev>0?good:bad).push(x)});
      good.sort(function(a,b){return b.ev-a.ev}); bad.sort(function(a,b){return b.ev-a.ev});
      $('#hint').textContent='Every player in each game, with what the model predicts. "Likely" is the range he lands in 80% of games. Type your bookmaker\'s line and odds and the edge appears; worthwhile bets move to the top.';
      if(good.length)html+='<h3>Worth taking ('+good.length+')</h3>'+good.map(function(x){return x.html}).join('');
      if(bad.length)html+='<h3>Not worth it at your odds ('+bad.length+')</h3>'+bad.map(function(x){return x.html}).join('');
      var groups=playersByGame(),total=0,shown=0,more=false;
      groups.forEach(function(gr){total+=gr.ps.length});
      html+='<h3>All players ('+total+')</h3>';
      if(!total)html+=none('No players match','Try another game, stat or name.');
      groups.forEach(function(gr){
        if(shown>=S.shown){more=true;return;}
        var slice=gr.ps.slice(0,S.shown-shown); shown+=slice.length; if(slice.length<gr.ps.length)more=true;
        html+='<h3 class="gh">'+esc(gname(gr.g))+' \u00b7 '+esc(when(gr.g))+'</h3>'+slice.map(playerCardHTML).join('');
      });
      if(more)html+='<button class="more" id="more">Show more players ('+(total-shown)+' left)</button>';
    }else{
      var its=visible();
      its.sort(function(a,b){return b.e.win-a.e.win||b.e.line-a.e.line});
      $('#hint').textContent=min>1?'Each line is the most likely one that still pays at least '+min.toFixed(2)+' (break-even). Type your bookmaker\'s line and odds; props with odds under '+min.toFixed(2)+' are hidden.':'Ranked by chance of landing. Type the line and odds your bookmaker shows.';
      html=its.slice(0,S.shown).map(function(x){return cardHTML(x.r,x.e,false)}).join('');
      if(!its.length)html=none('No props match','Try another game, stat or name.');
      if(its.length>S.shown)html+='<button class="more" id="more">Show more ('+(its.length-S.shown)+' left)</button>';
    }
    list.innerHTML=html;
    if(keep){
      var hosts=list.querySelectorAll('[data-key]');
      for(var i=0;i<hosts.length;i++){
        if(hosts[i].dataset.key===keep.key){var el=hosts[i].querySelector('[data-field="'+keep.field+'"]');
          if(el){el.focus();try{el.setSelectionRange(keep.pos,keep.pos)}catch(e){}} break;}
      }
    }
  }

  var timer=null;
  function later(){clearTimeout(timer);timer=setTimeout(render,700)}

  document.addEventListener('click',function(ev){
    var t=ev.target.closest('button'); if(!t)return;
    if(t.id==='recbtn'){S.view=S.view==='record'?null:'record';render();window.scrollTo(0,0);}
    else if(t.dataset.track){trackBet(t.dataset.track,t);}
    else if(t.dataset.del){LEDGER=LEDGER.filter(function(b){return b.id!==t.dataset.del});ledgerSave();render();}
    else if(t.dataset.sport){S.view=null;if(t.dataset.sport===S.sport)render();else switchSport(t.dataset.sport);}
    else if(t.dataset.tab){S.tab=t.dataset.tab;S.match=null;S.shown=PAGE;save();render();window.scrollTo(0,0);}
    else if(t.dataset.stat){S.stat=t.dataset.stat;S.shown=PAGE;save();render();}
    else if(t.dataset.side){S.side=t.dataset.side;save();render();}
    else if(t.dataset.ol){S.ol=t.dataset.ol;save();render();}
    else if(t.dataset.om){S.om=t.dataset.om;save();render();}
    else if(t.dataset.open){S.match=t.dataset.open;S.mview='props';S.mteam='all';render();window.scrollTo(0,0);}
    else if(t.dataset.back){S.match=null;render();window.scrollTo(0,0);}
    else if(t.dataset.mv){S.mview=t.dataset.mv;render();}
    else if(t.dataset.mt){S.mteam=t.dataset.mt;render();}
    else if(t.dataset.lg){S.lg=t.dataset.lg;render();}
    else if(t.id==='more'){S.shown+=PAGE;render();}
  });
  $('#game').addEventListener('change',function(e){S.game=e.target.value;S.shown=PAGE;render();});
  $('#q').addEventListener('input',function(e){S.q=e.target.value;S.shown=PAGE;later();});
  $('#min').addEventListener('input',function(e){S.min=e.target.value;save();later();});
  $('#target').addEventListener('change',function(e){S.target=parseFloat(e.target.value);save();render();});

  function num(v){var x=parseFloat(String(v).replace(',','.'));return (isNaN(x)||x<=0)?null:x}
  $('#list').addEventListener('input',function(ev){
    var inp=ev.target; if(!inp.dataset||!inp.dataset.field)return;
    var f=inp.dataset.field, v=num(inp.value);
    if(f==='line'||f==='odds'){                         // player props
      var host=inp.closest('[data-key]'), sk=host.dataset.key, r=cur.ROWMAP[host.dataset.base];
      var typ=host.classList.contains('srow');
      var shownLine=evalRow(r,typ).line;
      var st=S.rows[sk]||(S.rows[sk]={});
      if(v==null)delete st[f]; else st[f]=v;
      if(st.odds!=null&&st.line==null)st.line=shownLine;   // odds belong to the line you saw when you typed them
      if(st.line==null&&st.odds==null)delete S.rows[sk];
      save();
      var e=evalRow(r,typ);
      if(typ){host.querySelector('.sres').innerHTML=sresHTML(r,e);host.querySelector('.srl5').innerHTML=l5HTML(r,e);}
      else{host.querySelector('.pct').innerHTML=pctHTML(e);host.querySelector('.res').innerHTML=resHTML(r,e);host.querySelector('.l5').innerHTML=l5HTML(r,e);}
    }else if(f==='modds'){                              // match market odds
      var opt=inp.closest('.opt'), m=cur.GAMES[opt.dataset.mid], kind=opt.dataset.kind, sel=opt.dataset.sel, key=opt.dataset.key;
      var line=hasLine(kind)?mLine(m,kind):null;
      if(v==null)delete S.rows[key]; else S.rows[key]={odds:v,line:line};
      save(); var e2=mEval(m,kind,sel,line);
      opt.querySelector('.oedge').innerHTML=e2.ev!=null?edgePill(e2.ev,true)+trackBtn('m|'+key,e2.odds):'<span class="meta">Break-even '+fmtOdds(e2.be)+'</span>';
    }else if(f==='mline'){                              // handicap / total line
      var mk=inp.closest('.mk'), m2=cur.GAMES[mk.dataset.mid], k2=mk.dataset.kind, lk='ML|'+m2.id+'|'+k2;
      var lv=parseFloat(String(inp.value).replace(',','.'));
      if(isNaN(lv))delete S.rows[lk]; else S.rows[lk]={line:lv};
      save();
      mk.querySelectorAll('.opt').forEach(function(opt){
        var line2=mLine(m2,k2), e3=mEval(m2,k2,opt.dataset.sel,line2);
        opt.querySelector('.olab').textContent=mLabel(m2,k2,opt.dataset.sel,line2);
        opt.querySelector('.opct').textContent=fmtPct(e3);
        opt.querySelector('.oedge').innerHTML=e3.ev!=null?edgePill(e3.ev,true)+trackBtn('m|'+opt.dataset.key,e3.odds):'<span class="meta">Break-even '+fmtOdds(e3.be)+'</span>';
        var oi=opt.querySelector('input'); oi.value=e3.odds||'';
      });
    }else if(f==='oodds'){                              // outright odds
      var row=inp.closest('.orow'), key2=row.dataset.key, lgk=row.dataset.lg, tid=row.dataset.tid;
      if(v==null)delete S.rows[key2]; else S.rows[key2]={odds:v};
      save(); var t0=cur.d.outrights[lgk].teams.filter(function(t){return t.team_id===tid})[0], e4=oEval(lgk,t0,S.om);
      row.querySelector('.oedge').innerHTML=e4.ev!=null?edgePill(e4.ev)+trackBtn('o|'+key2,e4.odds):'<span class="meta">Break-even '+fmtOdds(e4.be)+'</span>';
    }
    later();
  });

  function build(sport,d){
    // Hide games that have already kicked off: their props are no longer bettable (also covers a stale file).
    var now=Date.now(), live={};
    d.games=d.games.filter(function(g){var ok=!g.start||Date.parse(g.start)>now;if(ok)live[g.id]=1;return ok});
    d.players=d.players.filter(function(p){return live[p.game]});
    var c={d:d,ROWS:[],ROWMAP:{},GAMES:{},STATS:d.stats||STATS_NBA};
    d.games.forEach(function(g){c.GAMES[g.id]=g});
    d.players.forEach(function(p){
      c.STATS.forEach(function(s){
        var x=p.stats[s]; if(!x)return;
        var row={base:p.game+'|'+p.name+'|'+s,p:p,stat:s,unit:d.labels[s],mu:x.mu,avg10:x.avg10,last5:x.last5,d:dist(x.mu,x.alpha)};
        c.ROWS.push(row);c.ROWMAP[row.base]=row;
      });
    });
    C[sport]=c;
  }
  function chrome(){
    var d=cur.d;
    $('#stat-chips').innerHTML='<button class="chip" data-stat="all" aria-pressed="true">All</button>'+cur.STATS.map(function(s){return '<button class="chip" data-stat="'+s+'" aria-pressed="false">'+esc(d.labels[s])+'</button>'}).join('');
    $('#game').innerHTML='<option value="all">All games</option>'+d.games.map(function(g){return '<option value="'+esc(g.id)+'">'+esc(gname(g))+' \u00b7 '+esc(when(g))+'</option>'}).join('');
    $('#game').value=S.game; $('#min').value=S.min; $('#target').value=String(S.target);
    var gen=new Date(d.generated_at);
    $('#asof').textContent='Results to '+new Date(d.data_through+'T12:00:00').toLocaleDateString([],{day:'numeric',month:'short'})+' \u00b7 updated '+gen.toLocaleString([],{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
    var age=(Date.now()-gen.getTime())/36e5, n=$('#stale');
    if(age>30){var days=Math.floor(age/24);n.hidden=false;n.textContent='These predictions are about '+(days>=1?days+' day'+(days>1?'s':''):Math.round(age)+' hours')+' old. Ask Claude to refresh them before you rely on them: injuries, line-ups and fixtures change daily.';}
    else n.hidden=true;
    $('#about-list').innerHTML=SPORTS[S.sport].about.map(function(t){return '<li>'+t+'</li>'}).join('');
  }
  function show(reset){cur=C[S.sport];S.match=null;S.lg='all';if(reset){S.game='all';S.stat='all';S.q='';$('#q').value='';}S.shown=PAGE;chrome();render();}
  function loadSport(sport,done){
    if(C[sport]){done();return;}
    fetch(SPORTS[sport].file).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){build(sport,d);done();}).catch(function(){
      $('#list').innerHTML='<div class="empty"><strong>Could not load the '+esc(SPORTS[sport].label)+' predictions</strong>Reload the page. If it keeps failing, ask Claude to republish it.</div>';
      $('#asof').textContent='';
    });
  }
  function switchSport(sport){
    if(sport===S.sport)return;
    var prev=S.sport; S.sport=sport; S.tab=SPORTS[sport].tabs[0];
    loadSport(sport,function(){save();show(true);window.scrollTo(0,0);});
  }
  /* ---------- Refresh now: starts the same refresh as the daily schedule ---------- */
  var RF={server:'Claude Code Remote',tool:'fire_trigger',trigger:'trig_0167Fv1vujkW4gn7qbYy18dQ',cooldown:600000,key:'propfinder-refresh'};
  var rmcp=null, ropen=false, rbusy=false, rmsg=null, rtimer=null;
  function rLast(){try{return parseInt(localStorage.getItem(RF.key)||'0',10)||0}catch(e){return 0}}
  function rSetLast(t){try{localStorage.setItem(RF.key,String(t))}catch(e){}}
  function rWait(){return Math.max(0,RF.cooldown-(Date.now()-rLast()))}
  function hhmm(t){return new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
  function dataAgeMin(){var d=cur&&cur.d;if(!d||!d.generated_at)return null;return Math.round((Date.now()-new Date(d.generated_at).getTime())/60000)}
  function rError(code){
    var T={
      approval_required:'Claude needs your permission to start a refresh. Tap Refresh now again and choose Allow.',
      consent_required:'Claude needs your permission to start a refresh. Tap Refresh now again and choose Allow.',
      not_in_manifest:'Refresh now is not allowed for this page. Open the page in claude.ai, signed in to your account, and allow it when asked.',
      not_granted:'Refresh now is not available in this view. Open the page in claude.ai, signed in to your account.',
      capability_disabled:'Refresh now is not available in this view. Open the page in claude.ai, signed in to your account.',
      capability_removed:'Refresh now is not available in this view. Open the page in claude.ai, signed in to your account.',
      server_not_connected:'The Claude Code Remote connector is not available for your account, so this button cannot start a refresh. The daily refresh still runs.',
      server_not_found:'The Claude Code Remote connector is not available for your account, so this button cannot start a refresh. The daily refresh still runs.',
      selection_required:'Choose which Claude Code Remote connector to use when asked, then tap Refresh now again.',
      needs_reauth:'Reconnect Claude Code Remote in Claude Settings, under Connectors, then try again.',
      blocked_by_policy:'Your organization does not allow this button to start a refresh.',
      tool_error:'Claude reported a problem starting the refresh. Try again in a few minutes. If it keeps failing, ask Claude to check the schedule.'
    };
    return {kind:'bad',text:T[code]||'Could not confirm that the refresh started. Wait two minutes and check the updated time at the top before trying again, so you do not start two runs.'};
  }
  function rRender(){
    var b=$('#rbtn'),p=$('#rpanel'); if(!b||!p)return;
    b.hidden=!rmcp; var wait=rWait();
    b.disabled=rbusy||wait>0; b.textContent=wait>0?'Refresh started':'Refresh now';
    var html='',kind='';
    if(rbusy){html='<span>Starting the refresh\u2026</span>';}
    else if(ropen){
      var age=dataAgeMin();
      html='<span>Start a refresh now? It takes about 5 minutes and uses a small part of your Claude usage.'+(age!==null&&age<60?' The data is only '+Math.max(age,0)+' minutes old.':'')+'</span><div class="rrow"><button type="button" class="primary" data-r="start">Start refresh</button><button type="button" data-r="cancel">Cancel</button></div>';
    }else if(rmsg){html='<span>'+esc(rmsg.text)+'</span>';kind=rmsg.kind;}
    else if(wait>0){html='<span>A refresh was started at '+hhmm(rLast())+'. This page updates by itself when it finishes (about 5 minutes). If nothing changes after 7 minutes, reload the page.</span>';kind='good';}
    p.hidden=!html; p.className='rpanel'+(kind?' '+kind:''); p.innerHTML=html;
    clearTimeout(rtimer); if(wait>0)rtimer=setTimeout(rRender,wait+500);
  }
  function rStart(){
    if(rbusy||rWait()>0||!rmcp)return;
    rbusy=true; rmsg=null; ropen=false; rRender();
    var done=false;
    rmcp.callTool(RF.server,RF.tool,{trigger_id:RF.trigger,text:'Run started from the Refresh now button on the page.'}).then(function(){
      rSetLast(Date.now()); rbusy=false; rmsg=null; rRender();
    },function(e){
      rbusy=false; rmsg=rError(e&&e.code); rRender();
    });
  }
  document.addEventListener('click',function(ev){
    var t=ev.target.closest('button'); if(!t)return;
    if(t.id==='rbtn'){if(rbusy||rWait()>0)return;ropen=!ropen;rmsg=null;rRender();}
    else if(t.dataset.r==='cancel'){ropen=false;rRender();}
    else if(t.dataset.r==='start'){rStart();}
  });
  try{
    if(window.claude&&window.claude.use){window.claude.use('mcp').then(function(m){rmcp=m||null;rRender();},function(){});}
  }catch(e){}

  loadResults();
  loadSport(S.sport,function(){show(false);ledgerLoad();});
})();
</script>
